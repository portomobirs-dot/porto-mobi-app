name: Validar regras Firestore no emulador
on:
  push:
    branches: [homologacao-motorista]
    paths:
      - 'firestore.rules'
      - 'testes/seguranca-firestore.test.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validar-firestore.yml'
  workflow_dispatch:
jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Testar regras no emulador isolado
        run: npm run test:security
