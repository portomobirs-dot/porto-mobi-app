name: Testes de seguranca do Porto Mobi
on:
  push:
    branches:
      - preparacao-correcoes-02
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seguranca-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias para testes
        run: npm install --no-audit --no-fund
      - name: Verificar sintaxe JavaScript
        run: |
          node --check js/cliente.js
          node --check js/motorista.js
          node --check js/admin.js
          node --check js/common.js
          node --check sw.js
          node --check testes/seguranca-firestore.test.mjs
          node --check testes/estrutura-pwa.test.mjs
      - name: Conferir formularios, manifestos e icones PWA
        run: node --test testes/estrutura-pwa.test.mjs
      - name: Testar permissao no Firestore Emulator, com dados ficticios
        run: npm run test:security
