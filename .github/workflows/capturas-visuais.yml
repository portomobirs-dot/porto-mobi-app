name: Capturas visuais - Porto Mobi
on:
  push:
    branches: [preparacao-correcoes-02]
    paths:
      - 'testes/capturar-telas.mjs'
      - '.github/workflows/capturas-visuais.yml'
      - 'cliente.html'
      - 'motorista.html'
      - 'admin.html'
      - 'index.html'
      - 'js/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capturas-mobile:
    runs-on: ubuntu-latest
    # Navegador Chromium e bibliotecas ja incluidos. Sem download manual.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar somente dependencias Node
        run: npm install --no-audit --no-fund
      - name: Gerar nove capturas isoladas para revisao visual
        run: node testes/capturar-telas.mjs
      - name: Salvar imagens como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: porto-mobi-capturas-mobile
          path: testes/capturas-mobile/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Publicar capturas ficticias no GitHub para visualizacao sem ZIP
        # So imagens de teste, com dados ficticios e bloqueio de acesso externo.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add testes/capturas-mobile/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar nove capturas de interface com dados ficticios"
            # A ramificacao pode receber atualizacoes entre checkout e publicacao.
            # Atualizar historico antes de enviar, sem sobrescrever outros commits.
            for tentativa in 1 2 3; do
              git fetch origin preparacao-correcoes-02
              git rebase FETCH_HEAD
              if git push origin HEAD:preparacao-correcoes-02; then
                echo "Capturas publicadas na ramificacao de preparacao."
                break
              fi
              if [ "$tentativa" -eq 3 ]; then
                echo "Falha ao publicar capturas apos 3 tentativas." >&2
                exit 1
              fi
            done
          fi
