name: Capturas visuais - Porto Mobi
on:
  push:
    branches: [preparacao-correcoes-02]
    paths:
      - 'testes/capturar-telas.mjs'
      - '.github/workflows/capturas-visuais.yml'
      - 'estilo-porto-mobi.css'
      - 'logo-porto-mobi.png'
      - 'cliente.html'
      - 'motorista.html'
      - 'admin.html'
      - 'index.html'
      - 'js/**'
  workflow_dispatch:
concurrency:
  group: porto-mobi-capturas-preparacao
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  capturas-mobile:
    runs-on: ubuntu-latest
    # Navegador Chromium e bibliotecas ja incluidos. Sem download manual.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar somente dependencias Node
        run: npm install --no-audit --no-fund
      - name: Gerar dezesseis capturas isoladas para revisao visual
        run: node testes/capturar-telas.mjs
      - name: Salvar imagens como artefato de teste
        uses: actions/upload-artifact@v4
        with:
          name: porto-mobi-capturas-mobile
          path: testes/capturas-mobile/*.png
          if-no-files-found: error
          retention-days: 14
      - name: Publicar dezesseis capturas ficticias no GitHub para visualizacao sem ZIP
        # Publica somente imagens de teste, ignorando capturas de codigo antigo.
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pasta=$(mktemp -d)
          cp testes/capturas-mobile/*.png "$pasta/"
          for tentativa in 1 2 3; do
            git fetch origin preparacao-correcoes-02
            if ! git diff --quiet "$GITHUB_SHA" FETCH_HEAD -- cliente.html motorista.html admin.html js/ testes/capturar-telas.mjs; then
              echo "Uma versao mais nova alterou as telas; nao publicar imagens antigas."
              exit 0
            fi
            git reset --hard FETCH_HEAD
            mkdir -p testes/capturas-mobile
            cp "$pasta"/*.png testes/capturas-mobile/
            git add testes/capturas-mobile/*.png
            if git diff --cached --quiet; then
              echo "Capturas ja estavam atualizadas."
              exit 0
            fi
            git commit -m "Atualizar capturas de interface com dados ficticios"
            if git push origin HEAD:preparacao-correcoes-02; then
              echo "Capturas publicadas na ramificacao de preparacao."
              exit 0
            fi
          done
          echo "Falha ao publicar capturas apos 3 tentativas." >&2
          exit 1
